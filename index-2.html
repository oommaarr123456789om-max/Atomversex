rnningcontent.blob.core.windows.net/elearnningcontent/content/2025/Primary/Primary4/Term2/Streem/Science_ARABIC_Prim4_TR2-T-W4.pdf","choiceGroup":""},{"id":"egp4-t2-4","stage":"primary","grade":4,"subject":"environment","track":"all","route":"all","term":"t2","unit":"الوحدة الثالثة: الطاقة والوقود","status":"curriculum","tool":"lab","minutes":9,"arTitle":"الوقود الأحفوري والتلوث وترشيد الاستهلاك","enTitle":"Fossil fuels, pollution and conservation","arSummary":"الوقود الأحفوري والتلوث وترشيد الاستهلاك ضمن موضوعات علوم الصف الرابع — الترم الثاني 2026–2027.","enSummary":"Fossil fuels, pollution and conservation in the Grade 4 Science Term 2 topic sequence for 2026–27.","arExplain":"نربط احتراق بعض أنواع الوقود بانبعاث ملوثات، ونناقش ترشيد الاستهلاك واختيار بدائل أقل أثرًا بيئيًا. هذا شرح مساعد للمذاكرة ويكمل كتاب المدرسة ولا يحل محله.","enExplain":"Connect the burning of some fuels with pollutant emissions and consider conservation and lower-impact alternatives. This is a study aid and does not replace the school textbook.","arExample":"تقليل استهلاك الوقود وتحسين كفاءة الأجهزة يقللان بعض الانبعاثات.","enExample":"Reducing fuel use and improving device efficiency can reduce some emissions.","arQ":"أي عبارة أدق بشأن الوقود الأحفوري والتلوث وترشيد الاستهلاك؟","enQ":"Which statement best describes Fossil fuels, pollution and conservation?","arOptions":["ترشيد الاستهلاك يحُد من استخدام الوقود","زيادة الهدر تقلل التلوث","كل ما سبق غير صحيح"],"enOptions":["Conservation can reduce fuel use","More waste reduces pollution","All statements are incorrect"],"correct":0,"arWhy":"نربط احتراق بعض أنواع الوقود بانبعاث ملوثات، ونناقش ترشيد الاستهلاك واختيار بدائل أقل أثرًا بيئيًا.","enWhy":"Connect the burning of some fuels with pollutant emissions and consider conservation and lower-impact alternatives.","sourceUrl":"https://darslab.com/ar/egypt/eg4/science-ar/index.html","choiceGroup":""},{"id":"egp4-t2-5","stage":"primary","grade":4,"subject":"physics","track":"all","route":"all","term":"t2","unit":"الوحدة الثالثة: الطاقة والوقود","status":"curriculum","tool":"experiments","minutes":9,"arTitle":"مصادر الطاقة المتجددة: الشمس والرياح والماء","enTitle":"Renewable energy: sun, wind and water","arSummary":"مصادر الطاقة المتجددة: الشمس والرياح والماء ضمن موضوعات علوم الصف الرابع — الترم الثاني 2026–2027.","enSummary":"Renewable energy: sun, wind and water in the Grade 4 Science Term 2 topic sequence for 2026–27.","arExplain":"نستكشف مصادر متجددة مثل الشمس والرياح والماء المتحرك، ونناقش استخداماتها وآثار بعض المشروعات في البيئة. هذا شرح مساعد للمذاكرة ويكمل كتاب المدرسة ولا يحل محله.","enExplain":"Explore renewable sources such as sunlight, wind and moving water, and discuss their uses and possible environmental effects. This is a study aid and does not replace the school textbook.","arExample":"يمكن استخدام حركة الماء لتدوير توربين وتوليد الكهرباء.","enExample":"Moving water can turn a turbine to generate electricity.","arQ":"أي عبارة أدق بشأن مصادر الطاقة المتجددة: الشمس والرياح والماء؟","enQ":"Which statement best describes Renewable energy: sun, wind and water?","arOptions":["الشمس والرياح والماء المتحرك مصادر متجددة","الفحم مصدر متجدد سريع التجدد","كل ما سبق غير صحيح"],"enOptions":["Sunlight, wind and moving water are renewable sources","Coal is a rapidly renewable source","All statements are incorrect"],"correct":0,"arWhy":"نستكشف مصادر متجددة مثل الشمس والرياح والماء المتحرك، ونناقش استخداماتها وآثار بعض المشروعات في البيئة.","enWhy":"Explore renewable sources such as sunlight, wind and moving water, and discuss their uses and possible environmental effects.","sourceUrl":"https://darslab.com/ar/egypt/eg4/science-ar/index.html","choiceGroup":""},{"id":"egp4-t2-6","stage":"primary","grade":4,"subject":"environment","track":"all","route":"all","term":"t2","unit":"الوحدة الرابعة: الأسطح المتغيرة","status":"curriculum","tool":"lab","minutes":9,"arTitle":"الأسطح المتغيرة وتفتت الصخور","enTitle":"Changing surfaces and rock breakdown","arSummary":"الأسطح المتغيرة وتفتت الصخور ضمن موضوعات علوم الصف الرابع — الترم الثاني 2026–2027.","enSummary":"Changing surfaces and rock breakdown in the Grade 4 Science Term 2 topic sequence for 2026–27.","arExplain":"نلاحظ كيف تتفتت الصخور وتتغير بفعل عوامل التجوية، ثم نربط ذلك بحركة المواد على سطح الأرض. هذا شرح مساعد للمذاكرة ويكمل كتاب المدرسة ولا يحل محله.","enExplain":"Observe how rocks break down through weathering and relate this to the movement of material over Earth’s surface. This is a study aid and does not replace the school textbook.","arExample":"قد تتفتت الصخور بفعل الماء وتغيرات الحرارة.","enExample":"Rocks can break down through water and temperature changes.","arQ":"أي عبارة أدق بشأن الأسطح المتغيرة وتفتت الصخور؟","enQ":"Which statement best describes Changing surfaces and rock breakdown?","arOptions":["التجوية تسهم في تفتت الصخور","التجوية تحول الصخور إلى نجوم","كل ما سبق غير صحيح"],"enOptions":["Weathering contributes to rock breakdown","Weathering turns rocks into stars","All statements are incorrect"],"correct":0,"arWhy":"نلاحظ كيف تتفتت الصخور وتتغير بفعل عوامل التجوية، ثم نربط ذلك بحركة المواد على سطح الأرض.","enWhy":"Observe how rocks break down through weathering and relate this to the movement of material over Earth’s surface.","sourceUrl":"https://darslab.com/ar/egypt/eg4/science-ar/index.html","choiceGroup":""},{"id":"egp4-t2-7","stage":"primary","grade":4,"subject":"environment","track":"all","route":"all","term":"t2","unit":"الوحدة الرابعة: الأسطح المتغيرة","status":"curriculum","tool":"lab","minutes":9,"arTitle":"التجوية والتعرية والترسيب","enTitle":"Weathering, erosion and deposition","arSummary":"التجوية والتعرية والترسيب ضمن موضوعات علوم الصف الرابع — الترم الثاني 2026–2027.","enSummary":"Weathering, erosion and deposition in the Grade 4 Science Term 2 topic sequence for 2026–27.","arExplain":"نفرق بين التجوية التي تكسر الصخور، والتعرية التي تنقل الفتات، والترسيب الذي يضع المواد في مكان جديد. هذا شرح مساعد للمذاكرة ويكمل كتاب المدرسة ولا يحل محله.","enExplain":"Distinguish weathering, which breaks rock down; erosion, which transports sediment; and deposition, which lays it down. This is a study aid and does not replace the school textbook.","arExample":"تنقل المياه الجارية بعض الرواسب ثم تترسب عندما تقل سرعتها.","enExample":"Flowing water transports sediment that may be deposited as its speed decreases.","arQ":"أي عبارة أدق بشأن التجوية والتعرية والترسيب؟","enQ":"Which statement best describes Weathering, erosion and deposition?","arOptions":["التعرية تنقل الفتات الصخري","الترسيب هو تبخر الماء","كل ما سبق غير صحيح"],"enOptions":["Erosion transports rock fragments","Deposition is water evaporation","All statements are incorrect"],"correct":0,"arWhy":"نفرق بين التجوية التي تكسر الصخور، والتعرية التي تنقل الفتات، والترسيب الذي يضع المواد في مكان جديد.","enWhy":"Distinguish weathering, which breaks rock down; erosion, which transports sediment; and deposition, which lays it down.","sourceUrl":"https://darslab.com/ar/egypt/eg4/science-ar/index.html","choiceGroup":""},{"id":"egp4-t2-8","stage":"primary","grade":4,"subject":"environment","track":"all","route":"all","term":"t2","unit":"الوحدة الرابعة: الأسطح المتغيرة","status":"curriculum","tool":"lab","minutes":9,"arTitle":"تغير مظاهر سطح الأرض والبراكين","enTitle":"Landform changes and volcanoes","arSummary":"تغير مظاهر سطح الأرض والبراكين ضمن موضوعات علوم الصف الرابع — الترم الثاني 2026–2027.","enSummary":"Landform changes and volcanoes in the Grade 4 Science Term 2 topic sequence for 2026–27.","arExplain":"نتعرف بعض العمليات التي تغير سطح الأرض، ومنها حركة المواد والبراكين، ونفسر أن سطح الأرض يتغير عبر أزمنة مختلفة. هذا شرح مساعد للمذاكرة ويكمل كتاب المدرسة ولا يحل محله.","enExplain":"Explore processes that change landforms, including material movement and volcanoes, recognising that Earth’s surface changes over different timescales. This is a study aid and does not replace the school textbook.","arExample":"قد تؤدي الحمم بعد تبردها إلى تكوين صخور جديدة.","enExample":"Lava can form new rock as it cools.","arQ":"أي عبارة أدق بشأن تغير مظاهر سطح الأرض والبراكين؟","enQ":"Which statement best describes Landform changes and volcanoes?","arOptions":["البراكين من العمليات التي تغير سطح الأرض","سطح الأرض لا يتغير أبدًا","كل ما سبق غير صحيح"],"enOptions":["Volcanoes are processes that change Earth’s surface","Earth’s surface never changes","All statements are incorrect"],"correct":0,"arWhy":"نتعرف بعض العمليات التي تغير سطح الأرض، ومنها حركة المواد والبراكين، ونفسر أن سطح الأرض يتغير عبر أزمنة مختلفة.","enWhy":"Explore processes that change landforms, including material movement and volcanoes, recognising that Earth’s surface changes over different timescales.","sourceUrl":"https://darslab.com/ar/egypt/eg4/science-ar/index.html","choiceGroup":""},{"id":"u1-general","stage":"university","grade":1,"subject":"chemistry","track":"all","tool":"calculator","minutes":22,"arTitle":"الكيمياء العامة: الحسابات والوحدات","enTitle":"General chemistry: calculations and units","arSummary":"تطبيق التحليل البُعدي والتحويل بين الكتلة والمول والتركيز.","enSummary":"Apply dimensional analysis and convert between mass, moles and concentration.","arExplain":"تبدأ الحسابات الجامعية بكتابة المعطيات والوحدات، ثم اختيار العلاقة المناسبة والتحقق من اتساق الأبعاد. يجب التمييز بين المولارية والموﻻلية والنسبة المئوية، وذكر درجة الحرارة أو كثافة المحلول عندما تكون مؤثرة.","enExplain":"University calculations begin by listing data and units, choosing an appropriate relation and checking dimensional consistency. Distinguish molarity, molality and percentage concentration, and state temperature or density assumptions when relevant.","arExample":"في المولارية M = n/V، يجب أن يكون الحجم باللتر عندما تستخدم وحدة mol/L.","enExample":"For molarity M = n/V, volume must be in litres when using mol/L.","arQ":"ما وحدة الحجم المناسبة مباشرة في حساب المولارية mol/L؟","enQ":"Which volume unit is used directly for molarity in mol/L?","arOptions":["اللتر","السنتيمتر","الكيلوجرام"],"enOptions":["Litre","Centimetre","Kilogram"],"correct":0,"arWhy":"المولارية كمية مادة لكل لتر من المحلول.","enWhy":"Molarity is amount of substance per litre of solution.","term":"annual","status":"enrichment"},{"id":"u1-uncertainty","stage":"university","grade":1,"subject":"physics","track":"physics","tool":"experiments","minutes":20,"arTitle":"القياس واللايقين وتحليل البيانات","enTitle":"Measurement, uncertainty and data analysis","arSummary":"نميز بين الدقة والتكرارية واللايقين في القياسات.","enSummary":"Distinguish accuracy, repeatability and measurement uncertainty.","arExplain":"كل قياس عملي له لايقين يرتبط بالأداة والطريقة والظروف. تكرار القياس يساعد في تقدير التشتت، بينما مقارنة النتيجة بقيمة مرجعية تساعد في تقييم الدقة. لا ينبغي كتابة أرقام معنوية أكثر مما تدعمه أداة القياس.","enExplain":"Every practical measurement has uncertainty related to the instrument, method and conditions. Repeated measurements help estimate spread, while comparison with a reference value helps assess accuracy. Significant figures should not exceed what the instrument supports.","arExample":"إذا كان تدريج أداة القياس 0.1 cm، فلا يصح الإبلاغ عن طول بدقة ستة منازل عشرية دون مبرر.","enExample":"If an instrument’s scale is 0.1 cm, reporting a length to six decimal places is not justified without additional evidence.","arQ":"ماذا تصف اللايقينية؟","enQ":"What does measurement uncertainty describe?","arOptions":["نطاق القيم المعقولة للقياس","أن القياس خاطئ دائمًا","عدد وحدات العينة فقط"],"enOptions":["A range of plausible measurement values","That the measurement is always wrong","Only the number of sample units"],"correct":0,"arWhy":"اللايقين يصف حدود المعرفة بالكمية المقاسة، ولا يعني أن القياس بلا فائدة.","enWhy":"Uncertainty describes limits on knowledge of the measured quantity; it does not make the measurement useless.","term":"annual","status":"enrichment"},{"id":"u1-statistics","stage":"university","grade":1,"subject":"math","track":"all","tool":"experiments","minutes":22,"arTitle":"الإحصاء الأساسي للبيانات العلمية","enTitle":"Basic statistics for scientific data","arSummary":"نستخدم المتوسط والمدى والتشتت لوصف مجموعة قياسات.","enSummary":"Use the mean, range and spread to describe measurements.","arExplain":"يلخص المتوسط الحسابي مركز مجموعة من القيم، ويصف المدى الفرق بين أكبر وأصغر قيمة. لا يكفي المتوسط وحده دائمًا؛ إذ ينبغي فحص التشتت وعدد القياسات والقيم الشاذة المحتملة وطريقة جمع البيانات.","enExplain":"The arithmetic mean summarises the centre of a data set, while the range is the difference between its largest and smallest values. The mean alone is not always sufficient; examine spread, sample size, possible outliers and how data were collected.","arExample":"للقيم 2 و4 و6، المتوسط الحسابي يساوي (2+4+6) ÷ 3 = 4، والمدى يساوي 6−2 = 4.","enExample":"For values 2, 4 and 6, the mean is (2+4+6) ÷ 3 = 4 and the range is 6−2 = 4.","arQ":"ما المتوسط الحسابي للقيم 2 و4 و6؟","enQ":"What is the arithmetic mean of 2, 4 and 6?","arOptions":["4","3","6"],"enOptions":["4","3","6"],"correct":0,"arWhy":"مجموع القيم 12، وبقسمته على عددها 3 يكون المتوسط 4.","enWhy":"The sum is 12; dividing by the three values gives a mean of 4.","term":"annual","status":"enrichment"},{"id":"u2-kinetics","stage":"university","grade":2,"subject":"chemistry","track":"chemistry","tool":"experiments","minutes":24,"arTitle":"حركية التفاعلات الكيميائية","enTitle":"Chemical reaction kinetics","arSummary":"ندرس سرعة التفاعل وقانون السرعة وطاقة التنشيط.","enSummary":"Study reaction rates, rate laws and activation energy.","arExplain":"تصف الحركية كيف تتغير تراكيز المواد مع الزمن. يحدد قانون السرعة تجريبيًا ويعتمد على تراكيز المواد وفق أسّ تجريبي. تساعد نظرية التصادم وطاقة التنشيط في تفسير تأثير الحرارة والعوامل الحفازة، مع عدم الخلط بين الحركية والاتزان.","enExplain":"Kinetics describes how concentrations change with time. The rate law is determined experimentally and depends on reactant concentrations through empirical orders. Collision theory and activation energy help explain temperature and catalyst effects; kinetics is distinct from equilibrium.","arExample":"قد يزيد العامل الحفاز سرعة الوصول إلى الاتزان عبر مسار أقل طاقة تنشيط، لكنه لا يغير ثابت الاتزان عند درجة الحرارة نفسها.","enExample":"A catalyst can speed up reaching equilibrium through a lower-activation-energy pathway, but it does not change the equilibrium constant at the same temperature.","arQ":"ما أثر العامل الحفاز على طاقة التنشيط؟","enQ":"What does a catalyst do to activation energy?","arOptions":["يوفر مسارًا بطاقة تنشيط أقل","يرفع طاقة التنشيط دائمًا","يغير هوية النواتج بالضرورة"],"enOptions":["Provides a pathway with lower activation energy","Always raises activation energy","Necessarily changes product identity"],"correct":0,"arWhy":"العامل الحفاز يوفر مسارًا بديلًا أقل حاجزًا للطاقة.","enWhy":"A catalyst provides an alternative pathway with a lower energy barrier.","term":"annual","status":"enrichment"},{"id":"u2-biochem","stage":"university","grade":2,"subject":"biology","track":"biochemistry","tool":"lab","minutes":24,"arTitle":"مقدمة في الإنزيمات والكيمياء الحيوية","enTitle":"Introduction to enzymes and biochemistry","arSummary":"نشرح كيف تؤثر الإنزيمات في سرعة التفاعلات الحيوية.","enSummary":"Explore how enzymes affect the rates of biological reactions.","arExplain":"الإنزيمات محفزات حيوية، وكثير منها بروتينات. ترتبط الركيزة بالموقع النشط، وتتأثر فعالية الإنزيم بعوامل مثل الحرارة ودرجة الحموضة وتركيز الركيزة. لكل إنزيم ظروف مناسبة، وقد تؤدي الظروف غير الملائمة إلى تغير بنيته ووظيفته.","enExplain":"Enzymes are biological catalysts, many of which are proteins. A substrate binds at an active site. Enzyme activity is affected by factors such as temperature, pH and substrate concentration. Each enzyme has suitable conditions, and extremes may alter its structure and function.","arExample":"يمكن تمثيل أثر زيادة تركيز الركيزة بمنحنى ترتفع سرعته أولًا ثم يقترب من قيمة قصوى عند تشبع المواقع النشطة.","enExample":"Increasing substrate concentration can raise reaction rate at first, then the rate approaches a maximum as active sites become saturated.","arQ":"لماذا قد تصل سرعة التفاعل الإنزيمي إلى حد أقصى؟","enQ":"Why can an enzyme-catalysed rate reach a maximum?","arOptions":["تشبع المواقع النشطة بالركيزة","اختفاء الإنزيم تلقائيًا دائمًا","تحول الركيزة إلى ضوء"],"enOptions":["Active sites become saturated with substrate","The enzyme always disappears spontaneously","The substrate turns into light"],"correct":0,"arWhy":"عند تشبع المواقع النشطة، لا تؤدي زيادة الركيزة وحدها إلى زيادة السرعة بنفس المعدل.","enWhy":"Once active sites are saturated, adding more substrate alone cannot increase the rate proportionally.","term":"annual","status":"enrichment"},{"id":"u3-spectra","stage":"university","grade":3,"subject":"chemistry","track":"chemistry","tool":"advancedlab","minutes":25,"arTitle":"التحليل الطيفي ومبادئ الامتصاص","enTitle":"Spectroscopy and absorption principles","arSummary":"نربط تفاعل الضوء مع المادة بالمعلومات عن التركيب والتركيز.","enSummary":"Relate light–matter interaction to structural and concentration information.","arExplain":"تقيس تقنيات التحليل الطيفي تفاعل المادة مع الإشعاع عند أطوال موجية مختلفة. في القياس الضوئي البسيط، ترتبط الامتصاصية بتركيز المادة وطول المسار ضمن شروط قانون بير–لامبرت، مع مراعاة المجال الخطي والمعايرة وخط الأساس.","enExplain":"Spectroscopic techniques measure how matter interacts with radiation at different wavelengths. In simple photometry, absorbance relates to concentration and path length under Beer–Lambert conditions, requiring attention to the linear range, calibration and baseline.","arExample":"A = εlc؛ لا تستخدم العلاقة كمقياس مطلق دون التأكد من صلاحية شروطها ومعايرة الجهاز.","enExample":"A = εlc; do not treat this relation as universally exact without checking its assumptions and instrument calibration.","arQ":"ما الذي يجب التحقق منه قبل استخدام منحنى المعايرة؟","enQ":"What should be checked before using a calibration curve?","arOptions":["أن العينة ضمن مجال المعايرة المناسب","أن جميع القياسات تساوي صفرًا","أن طول الموجة غير معروف"],"enOptions":["That the sample lies within the calibration range","That all readings are zero","That wavelength is unknown"],"correct":0,"arWhy":"الاستقراء خارج مجال المعايرة قد يعطي نتائج غير موثوقة.","enWhy":"Extrapolating outside the calibration range can produce unreliable results.","term":"annual","status":"enrichment"},{"id":"u3-electro","stage":"university","grade":3,"subject":"chemistry","track":"chemistry","tool":"advancedlab","minutes":24,"arTitle":"الكهروكيمياء والخلايا","enTitle":"Electrochemistry and cells","arSummary":"نربط تفاعلات الأكسدة والاختزال بانتقال الإلكترونات والطاقة.","enSummary":"Connect redox reactions with electron transfer and energy.","arExplain":"تتضمن تفاعلات الأكسدة والاختزال انتقال الإلكترونات بين الأنواع الكيميائية. في الخلية الجلفانية يحدث الأكسدة عند المصعد والاختزال عند المهبط، وتتحول الطاقة الكيميائية إلى طاقة كهربائية. تعتمد جهود الخلية على الظروف والأنشطة الكيميائية.","enExplain":"Redox reactions involve electron transfer between chemical species. In a galvanic cell, oxidation occurs at the anode and reduction at the cathode, converting chemical energy into electrical energy. Cell potentials depend on conditions and chemical activities.","arExample":"يمكن حساب جهد الخلية القياسي من جهود الاختزال القياسية للكاثود والأنود وفق الاصطلاح المستخدم.","enExample":"The standard cell potential can be calculated from standard reduction potentials for the cathode and anode using the stated convention.","arQ":"أين يحدث الاختزال في الخلية الجلفانية؟","enQ":"Where does reduction occur in a galvanic cell?","arOptions":["المهبط","المصعد","القنطرة الملحية"],"enOptions":["Cathode","Anode","Salt bridge"],"correct":0,"arWhy":"الاختزال يحدث عند المهبط، والأكسدة عند المصعد.","enWhy":"Reduction occurs at the cathode; oxidation occurs at the anode.","term":"annual","status":"enrichment"},{"id":"u4-materials","stage":"university","grade":4,"subject":"physics","track":"materials","tool":"lab","minutes":26,"arTitle":"علوم المواد والبنية والخواص","enTitle":"Materials science: structure and properties","arSummary":"نربط البنية المجهرية بالخواص الميكانيكية والحرارية والكهربائية.","enSummary":"Relate microstructure to mechanical, thermal and electrical properties.","arExplain":"تتأثر خواص المواد بتركيبها الكيميائي وبنيتها البلورية والعيوب المجهرية وحجم الحبيبات والمعالجة. لا تكفي صورة ثلاثية الأبعاد وحدها لإثبات خاصية؛ بل يلزم نموذج أو قياس محدد مع توضيح حدوده.","enExplain":"Material properties depend on chemical composition, crystal structure, defects, grain size and processing. A 3D visual alone cannot prove a property; a defined model or measurement is required, with limitations stated.","arExample":"قد يؤدي تغيير حجم الحبيبات في بعض السبائك إلى تغيير مقاومتها الميكانيكية، لكن العلاقة تعتمد على نوع المادة وظروف المعالجة.","enExample":"Changing grain size can affect the mechanical strength of some alloys, but the relationship depends on material and processing conditions.","arQ":"ما الذي يحدد خواص المادة؟","enQ":"What helps determine a material’s properties?","arOptions":["التركيب والبنية والمعالجة","اللون الظاهر فقط","شكل الصورة على الشاشة فقط"],"enOptions":["Composition, structure and processing","Visible colour alone","How an image looks on screen alone"],"correct":0,"arWhy":"خواص المواد تنتج من تفاعل عوامل التركيب والبنية والتاريخ التصنيعي.","enWhy":"Material properties emerge from composition, structure and processing history.","term":"annual","status":"enrichment"},{"id":"u4-research","stage":"university","grade":4,"subject":"environment","track":"environment","tool":"experiments","minutes":23,"arTitle":"تصميم البحث العلمي وأمانة البيانات","enTitle":"Scientific research design and data integrity","arSummary":"نبني سؤالًا قابلًا للاختبار ونوثق الطريقة والنتائج وحدودها.","enSummary":"Build testable questions and document methods, results and limitations.","arExplain":"يبدأ البحث بسؤال واضح وفرضية قابلة للاختبار. يجب تحديد المتغيرات، واختيار طريقة قياس مناسبة، وتسجيل البيانات كما جُمعت، ثم تحليلها مع ذكر عدم اليقين والقيود. لا يجوز حذف نتائج غير مناسبة أو اختلاق قياسات.","enExplain":"Research starts with a clear question and testable hypothesis. Define variables, select suitable measurements, record data as collected, and analyse it while reporting uncertainty and limitations. Results must not be fabricated or selectively discarded.","arExample":"في مقارنة عينتين، نوثق طريقة أخذ العينات وعدد القياسات والظروف التي قد تؤثر في النتيجة.","enExample":"When comparing two samples, document sampling method, number of measurements and conditions that could influence the result.","arQ":"ما الممارسة الصحيحة عند ظهور نتيجة لا تدعم الفرضية؟","enQ":"What should you do when a result does not support the hypothesis?","arOptions":["تسجيلها وتحليلها بصدق","حذفها دون توضيح","تغيير الأرقام لتناسب التوقع"],"enOptions":["Record and analyse it honestly","Delete it without explanation","Change the numbers to fit expectations"],"correct":0,"arWhy":"العلم يعتمد على توثيق النتائج كما هي، ثم مراجعة الفرضية أو المنهج.","enWhy":"Science depends on honest records; revise the hypothesis or method rather than altering data.","term":"annual","status":"enrichment"}],"sources":[{"type":"official","title":"Egyptian Ministry of Education e-Library","url":"https://ellibrary.moe.gov.eg/books/","note":"Official electronic library for current student textbooks; select stage, grade, subject, language and term."},{"type":"official","title":"Ministry secondary books portal","url":"https://ellibrary.moe.gov.eg/Books-sec/","note":"Official secondary-stage books portal."},{"type":"official","title":"Integrated Science — Grade 10, Term 1, 2026/2027 assessment PDF","url":"https://elearnningcontent.blob.core.windows.net/elearnningcontent/2026_2027/Secondry/Secondry1/Term1/ClassrHomeAssessmentsTest/Integrated_science_ARABIC_Sec1_TR1_6W.pdf","note":"Official Ministry material confirms Integrated Science for first secondary in 2026/2027."},{"type":"supporting","title":"Grade 4 Science 2026/2027 topic outline","url":"https://www.egypttelegraph.com/article/282429/حل-كتاب-العلوم-للصف-الرابع-الابتدائي-المنهج","note":"Supporting news outline; verify against official textbook."}],"courseCount":132,"bilingualMode":"Arabic-English parallel support with selectable learning levels","coverageNote":"The academy is a bilingual study companion and topic map, not a complete reproduction of every official textbook. Always verify lesson order and assessed content against the current Ministry textbook and school distribution.","edition":"8.3.0 Verified Core + Quiz Center","deviceSupport":"Responsive CSS breakpoints, live visual viewport adaptation, device pixel ratio awareness, and ResizeObserver container adaptation"}</script><script>
(()=>{'use strict';
const CURR=JSON.parse(document.getElementById('curriculum-data').textContent),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{let v=localStorage.getItem('avx54:'+k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('avx54:'+k,JSON.stringify(v))}catch{}}};
let lang=store.get('lang','ar'),bilingualMode=store.get('bilingualMode',true),theme=store.get('theme','dark'),page='home',stage=store.get('stage','preparatory'),grade=+store.get('grade',2),route='general',track='all',subject='all',term='all',selectedCourse=null,selectedAnswer=null,lessonChecked=false,completed=store.get('completed',[]),notes=store.get('notes',[]),selectedElement=6,atomSpeed=.7,learningLevel=store.get('learningLevel','simple'),challengeAnswers=store.get('challengeAnswers',{}),challengeGuideOpen=false;
let quizHistory=store.get('quizHistory',[]),quizQuestions=[],quizIndex=0,quizScore=0,quizSelected=null,quizAnswered=false;
quizHistory=Array.isArray(quizHistory)?quizHistory.filter(x=>x&&typeof x==='object'&&Number.isFinite(x.score)&&Number.isFinite(x.total)).slice(-50):[];
// Normalize persisted browser data before any page tries to render it.
if(!['ar','en'].includes(lang))lang='ar';
if(!['dark','light'].includes(theme))theme='dark';
if(typeof bilingualMode!=='boolean')bilingualMode=true;
if(!['primary','preparatory','secondary','university'].includes(stage))stage='preparatory';
if(!['simple','medium','advanced'].includes(learningLevel))learningLevel='simple';
completed=Array.isArray(completed)?[...new Set(completed.filter(id=>typeof id==='string'&&CURR.courses.some(c=>c.id===id)))]:[];
notes=Array.isArray(notes)?notes.filter(n=>n&&typeof n.title==='string'&&typeof n.body==='string').slice(0,500).map(n=>({title:n.title.slice(0,90),body:n.body.slice(0,12000),at:typeof n.at==='string'?n.at:''})):[];
if(!challengeAnswers||typeof challengeAnswers!=='object'||Array.isArray(challengeAnswers))challengeAnswers={};
const isAr=()=>lang==='ar',tr=(a,e)=>isAr()?a:e,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stageNames={primary:['الابتدائية','Primary'],preparatory:['الإعدادية','Preparatory'],secondary:['الثانوية','Secondary'],university:['الجامعية','University']};
const gradeLabel=(st,g)=>st==='primary'?tr(`الصف ${g} الابتدائي`,`Grade ${g} Primary`):st==='preparatory'?tr(`الصف ${g} الإعدادي`,`Grade ${g} Preparatory`):st==='secondary'?tr(`الصف ${g} الثانوي`,`Grade ${g} Secondary`):tr(`السنة ${g} الجامعية`,`University Year ${g}`);
const navItems=[['home','⌂','الرئيسية','Home'],['academy','🎓','الأكاديمية التعليمية','Learning Academy'],['quiz','🧠','اختبر معلوماتك','Quiz Center'],['periodic','▦','الجدول الدوري','Periodic Table'],['elements3d','◉','العناصر ثلاثية الأبعاد','3D Elements'],['forge','⚗','لعبة دمج العناصر','Element Forge'],['atom','◉','مستكشف الذرة','Atom Explorer'],['lab','⚗','معمل العلوم','Science Lab'],['observatory','✦','مرصد العلوم','Science Observatory'],['microscope','⌕','المايكروسكوب','Microscope'],['molecules','⚛','استوديو الجزيئات','Molecular Studio'],['materials','◇','مستكشف المواد','Material Explorer'],['chemistry','∑','أدوات الكيمياء','Chemistry Tools'],['notes','▤','الملاحظات','Notes'],['settings','⚙','الإعدادات','Settings']];
function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),2600)}
function go(p){page=p;$('#sidebar').classList.remove('open');render()}
function nav(){$('#nav').innerHTML=navItems.map(([id,ic,ar,en])=>`<button class="${page===id?'active':''}" data-page="${id}"><i>${ic}</i><span>${tr(ar,en)}</span></button>`).join('')}
function header(k,tit,d,extra=''){return `<div class="head"><div><div class="eyebrow">${k}</div><h1 class="title">${tit}</h1><p class="desc">${d}</p></div>${extra?`<div class="actions">${extra}</div>`:''}</div>`}
function btn(t,a,c=''){return `<button class="btn ${c}" data-action="${a}">${t}</button>`}
function home(){let n=completed.length,p=Math.round(100*n/Math.max(1,CURR.courses.length)),xp=n*25,rank=n>=15?tr('باحث علمي','Science Researcher'):n>=5?tr('مستكشف نشيط','Active Explorer'):n>=1?tr('مستكشف ناشئ','Young Explorer'):tr('ابدأ رحلتك','Start your journey');return `${header('ATOMVERSE X · SCIENCE STUDIO',tr('اكتشف العلوم بطريقة تفاعلية','Explore science interactively'),tr('أكاديمية المنهج المصري، معمل محاكاة، مايكروسكوب متحرك، وجدول دوري وأدوات كيمياء — في ملف واحد.','Egyptian curriculum academy, simulation lab, animated microscope, periodic table and chemistry tools — all in one file.'))}<section class="hero"><div class="hero-copy"><div class="eyebrow">${tr('مختبرك العلمي الشخصي','YOUR PERSONAL SCIENCE STUDIO')}</div><h2>${tr('من المنهج إلى التجربة…<br>افهم العلم بنفسك','From curriculum to experiment…<br>understand science hands-on')}</h2><p>${tr('ابدأ بصفك الدراسي، ثم انتقل من الشرح إلى المحاكاة وشاهد النماذج العلمية وهي تتحرك أمامك.','Start with your grade, then move from lessons to simulations and watch scientific models come alive.')}</p><div class="actions">${btn(tr('افتح الأكاديمية','Open Academy'),'academy','primary')}${btn(tr('افتح المايكروسكوب','Open Microscope'),'microscope')}${btn(tr('تثبيت التطبيق','Install app'),'installApp','ghost')}</div></div><div class="heroatom"><i class="orbit"></i><i class="orbit"></i><i class="orbit"></i><i class="nucleus"></i></div></section><div class="grid4"><div class="stat"><label>${tr('دروس الأكاديمية','Academy lessons')}</label><strong>132</strong><small>${tr('منها 9 جامعية إثرائية','including 9 university enrichment cards')}</small></div><div class="stat"><label>${tr('الدروس المكتملة','Completed lessons')}</label><strong>${n}</strong><small>${tr('محفوظة على هذا الجهاز','saved on this device')}</small></div><div class="stat"><label>${tr('عناصر الجدول الدوري','Periodic elements')}</label><strong>118</strong><small>${tr('عرض تفاعلي وبحث','interactive view and search')}</small></div><div class="stat"><label>${tr('تقدم الأكاديمية','Academy progress')}</label><strong>${p}%</strong><div class="progress"><span style="width:${p}%"></span></div></div></div><section class="achievement-strip"><div><span class="eyebrow">${tr('إنجازاتك العلمية','YOUR SCIENCE MILESTONES')}</span><b>🏆 ${rank}</b><small>${tr('نقاط الخبرة','Experience points')}: ${xp} XP · ${tr('كل درس مكتمل = 25 نقطة','Each completed lesson = 25 XP')}</small></div><div class="achievement-badges"><span class="tag ${n>=1?'green':''}">🌱 ${tr('أول درس','First lesson')}</span><span class="tag ${n>=5?'green':''}">🧩 ${tr('5 دروس','5 lessons')}</span><span class="tag ${n>=15?'green':''}">🚀 ${tr('15 درسًا','15 lessons')}</span></div></section><div class="quick">${[['🎓','الأكاديمية','academy','المنهج والصفوف','Academy','Curriculum and grades'],['🧠','اختبر معلوماتك','quiz','10 أسئلة عشوائية','Quiz Center','10 random questions'],['⚗','معمل العلوم','lab','محاكاة الظواهر','Science Lab','Simulate phenomena'],['⌕','المايكروسكوب','microscope','عينات متحركة','Microscope','Moving specimens'],['▦','الجدول الدوري','periodic','118 عنصرًا','Periodic Table','118 elements'],['◉','مستكشف الذرة','atom','نموذج ذري متحرك','Atom Explorer','Animated atomic model'],['∑','أدوات الكيمياء','chemistry','الكتلة والمعادلات','Chemistry Tools','Mass and equations']].map(([ic,a,p,s,en,sen])=>`<button data-page="${p}"><span>${ic}</span><b>${tr(a,en)}</b><small>${tr(s,sen)}</small></button>`).join('')}</div><div class="notice">${tr('المايكروسكوب في وضع المحاكاة يعرض نماذج تعليمية متحركة، وليس صورة مجهر حقيقي. ويمكنك تشغيل كاميرا الجهاز لعرض صورة حية فعلية، لكن كاميرا الهاتف لا تتحول تلقائيًا إلى مجهر بصري.','Microscope simulation shows animated educational models, not real microscope footage. You can turn on your device camera for a genuine live image, but a phone camera does not automatically become an optical microscope.')}</div>`}

let obsMode='waves',obsRunning=true,obsTime=0,obsLast=0,obsRAF=0,obsParams={frequency:2,amplitude:55,tension:50,voltage:6,resistance:12,gravity:9.8,prey:65,predator:24},obsLog=(()=>{const v=store.get('obsLog',[]);return Array.isArray(v)?v.filter(x=>x&&typeof x==='object'&&typeof x.value==='string').slice(-500):[]})();

function obsControls(){let fields=obsMode==='waves'?[['frequency','التردد','Frequency',.5,8,.1,'Hz'],['amplitude','السعة','Amplitude',10,90,1,'%'],['tension','شد الوسط','Medium tension',10,100,1,'%']]:obsMode==='circuit'?[['voltage','فرق الجهد','Voltage',1,24,.5,'V'],['resistance','المقاومة','Resistance',1,100,1,'Ω']]:obsMode==='gravity'?[['gravity','تسارع الجاذبية','Gravitational acceleration',1,25,.1,'m/s²']]:[['prey','الفريسة','Prey',5,100,1,'%'],['predator','المفترس','Predator',5,80,1,'%']];return fields.map(([id,ar,en,min,max,step,unit])=>`<div class="obs-control"><label>${tr(ar,en)} <b id="${id}Val">${obsParams[id]} ${unit}</b></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${obsParams[id]}"></div>`).join('')+`<button class="btn small ghost" data-action="obsReset">${tr('إعادة ضبط النموذج','Reset model')}</button>`}
function obsMetrics(){let a=obsParams,items=obsMode==='waves'?[['التردد الفعلي','Effective frequency',effectiveWaveFrequency().toFixed(2)+' Hz'],['الزمن الدوري','Period',(1/effectiveWaveFrequency()).toFixed(2)+' s'],['السعة','Amplitude',a.amplitude+'%']]:obsMode==='circuit'?[['التيار','Current',(a.voltage/a.resistance).toFixed(3)+' A'],['القدرة','Power',(a.voltage*a.voltage/a.resistance).toFixed(2)+' W'],['المقاومة','Resistance',a.resistance+' Ω']]:obsMode==='gravity'?[['الجاذبية','Gravity',a.gravity.toFixed(1)+' m/s²'],['وزن 1 كجم','Weight',a.gravity.toFixed(2)+' N'],['قيمة الأرض','Earth', '9.8 m/s²']]:[['الفريسة','Prey',a.prey+'%'],['المفترس','Predator',a.predator+'%'],['التوازن','Balance',Math.abs(a.prey-a.predator)+'% فرق']];return items.map(x=>`<div class="obs-metric"><small>${tr(x[0],x[1])}</small><b>${x[2]}</b></div>`).join('')}
function drawObs(ts){let c=$('#obsCanvas');if(!c)return;let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);if(c.width!==Math.round(r.width*d)||c.height!==Math.round(r.height*d)){c.width=r.width*d;c.height=r.height*d}let x=c.getContext('2d'),w=r.width,h=r.height;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);x.fillStyle='#071321';x.fillRect(0,0,w,h);x.strokeStyle='#28425b66';x.lineWidth=1;for(let i=1;i<10;i++){x.beginPath();x.moveTo(w*i/10,0);x.lineTo(w*i/10,h);x.stroke();x.beginPath();x.moveTo(0,h*i/8);x.lineTo(w,h*i/8);x.stroke()}let t=obsTime/1000,a=obsParams;if(obsMode==='waves'){const f=effectiveWaveFrequency();x.beginPath();x.strokeStyle='#43e2f3';x.lineWidth=2.5;for(let px=0;px<=w;px++){let y=h/2-Math.sin(px/w*Math.PI*2*f-t*2*f)*h*.38*a.amplitude/100;px?x.lineTo(px,y):x.moveTo(px,y)}x.stroke();x.fillStyle='#d8faff';x.font='12px sans-serif';x.fillText('f = f₀ × √(T / T₀)',18,24)}else if(obsMode==='circuit'){x.strokeStyle='#a58bff';x.lineWidth=4;x.beginPath();x.moveTo(w*.2,h*.5);x.lineTo(w*.8,h*.5);x.lineTo(w*.8,h*.25);x.lineTo(w*.2,h*.25);x.closePath();x.stroke();x.strokeStyle='#43e2f3';x.lineWidth=5;x.beginPath();x.moveTo(w*.45,h*.25);x.lineTo(w*.45,h*.5);x.stroke();x.fillStyle='#43e2f3';for(let i=0;i<8;i++){let px=w*.2+((t*60+i*32)%(w*.6));x.beginPath();x.arc(px,h*.25,4,0,7);x.fill()}x.fillStyle='#fff';x.font='13px sans-serif';x.fillText(`${a.voltage} V`,w*.22,h*.18);x.fillText(`${a.resistance} Ω`,w*.48,h*.62)}else if(obsMode==='gravity'){let cx=w/2,cy=h/2,rr=Math.min(w,h)*.3;x.strokeStyle='#54738f';x.setLineDash([5,7]);x.beginPath();x.ellipse(cx,cy,rr*1.5,rr*.72,-.35,0,7);x.stroke();x.setLineDash([]);let ang=t*Math.sqrt(a.gravity/9.8),px=cx+Math.cos(ang)*rr*1.5,py=cy+Math.sin(ang)*rr*.72;x.fillStyle='#ffca70';x.beginPath();x.arc(cx,cy,22,0,7);x.fill();x.fillStyle='#43e2f3';x.beginPath();x.arc(px,py,9,0,7);x.fill();x.strokeStyle='#a58bff';x.beginPath();x.moveTo(cx,cy);x.lineTo(px,py);x.stroke()}else{let cx=w/2,cy=h/2;x.strokeStyle='#43e2f3';x.lineWidth=3;x.beginPath();for(let i=0;i<w;i++){let phase=i/w*8*Math.PI+t*.7;let y=cy-Math.sin(phase)*a.prey/100*h*.36;i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke();x.strokeStyle='#ff8296';x.beginPath();for(let i=0;i<w;i++){let phase=i/w*8*Math.PI+t*.7+1.4;let y=cy-Math.sin(phase)*a.predator/100*h*.36;i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke();x.fillStyle='#dcecff';x.font='12px sans-serif';x.fillText(tr('الفريسة','Prey'),15,22);x.fillStyle='#ff8296';x.fillText(tr('المفترس','Predator'),75,22)}}

if(micMode==='camera'&&cameraStream){const v=$('#cameraVideo');if(v&&v.readyState>=2){x.save();x.translate(w/2,h/2);x.scale(micZoom,micZoom);x.drawImage(v,-w/2,-h/2,w,h);x.restore();}else {x.fillStyle='#fff';x.fillText(tr('في انتظار بث الكاميرا…','Waiting for camera…'),18,28);}}
else if(micMode==='photo'&&photoImage){const scale=Math.max(w/photoImage.width,h/photoImage.height)*micZoom/2.5;x.save();x.translate(w/2,h/2);x.scale(scale,scale);x.drawImage(photoImage,-photoImage.width/2,-photoImage.height/2);x.restore();}
else {const s=SAMPLES.find(q=>q.id===micSample)||SAMPLES[0];x.save();x.beginPath();x.arc(w/2,h/2,Math.min(w,h)*.48,0,Math.PI*2);x.clip();x.fillStyle='#071522';x.fillRect(0,0,w,h);x.strokeStyle='#284a62';x.lineWidth=1;for(let i=0;i<24;i++){x.beginPath();x.arc((i*83+t*5)%w,(i*59)%h,10,0,7);x.stroke();}
if(s.kind==='cell'){for(let i=0;i<8;i++){let xx=w*.2+(i%4)*w*.16,yy=h*.25+Math.floor(i/4)*h*.42;x.fillStyle=s.id==='plant'?'#1d795a99':'#4272a788';x.strokeStyle=s.id==='plant'?'#9ce3b5':'#9edbfa';x.lineWidth=2;x.beginPath();x.ellipse(xx,yy,w*.07,h*.12,.2,0,7);x.fill();x.stroke();x.fillStyle='#b68aff';x.beginPath();x.arc(xx,yy,Math.min(w,h)*.025,0,7);x.fill();if(s.id==='plant'){for(let k=0;k<5;k++){x.fillStyle='#85d46d';x.beginPath();x.ellipse(xx-15+k*7,yy-17,4,8,.5,0,7);x.fill();}}}}
else if(s.kind==='discs'){for(let i=0;i<35;i++){let xx=(i*71)%w,yy=(i*113)%h,rr=8+(i%3)*3;x.fillStyle=i%7===0?'#8b64b8':'#c95e69';x.beginPath();x.ellipse(xx,yy,rr*1.2,rr,.2,0,7);x.fill();x.strokeStyle='#f5a5a9';x.stroke();}}

function startMicLoop(){if(micRAF)cancelAnimationFrame(micRAF);const loop=ts=>{if(page!=='microscope'||document.hidden){micRAF=0;return;}if(!micPaused)drawMic(ts);micRAF=requestAnimationFrame(loop);};micRAF=requestAnimationFrame(loop);}
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){micMode='simulation';toast(tr('الكاميرا غير مدعومة في هذا المتصفح؛ استمر في وضع المحاكاة.','Camera is not supported here; simulation mode remains available.'));render();return;}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});micMode='camera';micPaused=false;render();const v=$('#cameraVideo');if(!v)throw new Error('Camera video element unavailable');v.srcObject=cameraStream;await v.play();drawMic(performance.now());}catch(err){stopCamera();micMode='simulation';toast(tr('تعذر فتح الكاميرا. راجع إذن المتصفح أو استخدم المحاكاة.','Could not open the camera. Check browser permission or use simulation.'));render();}}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}const v=$('#cameraVideo');if(v&&v.srcObject){v.pause?.();v.srcObject=null;}}
function choosePhoto(){$('#imageInput')?.click();}
function loadPhoto(file){if(!file||!file.type?.startsWith('image/')){toast(tr('اختر ملف صورة صالحًا.','Choose a valid image file.'));return;}if(file.size>12*1024*1024){toast(tr('حجم الصورة أكبر من 12 ميجابايت.','Image is larger than 12 MB.'));return;}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{photoImage=img;micMode='photo';render();URL.revokeObjectURL(url);};img.onerror=()=>{URL.revokeObjectURL(url);toast(tr('تعذر قراءة الصورة.','Could not read the image.'));};img.src=url;}

function drawMolecule(){const c=$('#moleculeCanvas');if(!c)return;const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);if(!r.width||!r.height)return;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.fillStyle='#071321';x.fillRect(0,0,r.width,r.height);const m=MOLECULES.find(v=>v.id===moleculeId)||MOLECULES[0],a=moleculeAngle*Math.PI/180,scale=Math.min(r.width,r.height)*.19;
const pts=m.atoms.map(at=>{let [sym,xx,yy,zz]=at,rx=xx*Math.cos(a)-zz*Math.sin(a),rz=xx*Math.sin(a)+zz*Math.cos(a),depth=1/(1+rz*.12);return {sym,x:r.width/2+rx*scale*depth,y:r.height/2-yy*scale*depth,z:rz,rad:(sym==='O'||sym==='Cl'||sym==='Na'?17:13)*depth};});

const colors={H:'#e9f1f7',C:'#384453',O:'#e56a6f',N:'#5b93e8',Cl:'#57c889',Na:'#ad82d8'};pts.sort((p,q)=>p.z-q.z).forEach(p=>{const g=x.createRadialGradient(p.x-p.rad*.35,p.y-p.rad*.4,1,p.x,p.y,p.rad);g.addColorStop(0,'#fff');g.addColorStop(.25,colors[p.sym]||'#43e2f3');g.addColorStop(1,'#101b2b');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.rad,0,7);x.fill();x.strokeStyle='#d8efff99';x.stroke();x.fillStyle='#fff';x.font='11px sans-serif';x.textAlign='center';x.fillText(p.sym,p.x,p.y+p.rad+15);});}

function runSelfTests(){const tests=[];const check=(name,fn)=>{try{tests.push({name,ok:!!fn()});}catch(e){tests.push({name,ok:false,error:String(e.message||e)});}};
check('118 unique element symbols',()=>ELEMENTS.length===118&&new Set(SYM).size===118);
check('All element records complete',()=>ELEMENTS.every(e=>e.z>0&&e.s&&e.name&&e.ar&&e.mass>0&&e.period>0));
check('Four learning stages',()=>['primary','preparatory','secondary','university'].every(st=>CURR.courses.some(c=>c.stage===st)));
check('132 curriculum cards',()=>CURR.courses.length===132);
check('Eight lab stations',()=>LABS.length===8);
check('Ten microscope samples',()=>SAMPLES.length===10);
check('Molar mass of water',()=>Math.abs(molarMass('H2O').mass-18.015)<0.03);
check('Nested formula brackets',()=>Math.abs(molarMass('Ca(OH)2').mass-74.092)<0.08);
check('Hydrate formula',()=>Math.abs(molarMass('CuSO4·5H2O').mass-249.68)<0.15);
check('Square + nested brackets',()=>Object.keys(parseFormula('K4[Fe(CN)6]')).length===4);
check('Water equation balance',()=>balanceEquation('H2 + O2 -> H2O').pretty==='2H2 + O2 → 2H2O');
check('Iron oxide equation balance',()=>balanceEquation('Fe + O2 -> Fe2O3').pretty==='4Fe + 3O2 → 2Fe2O3');
check('Neutralization equation balance',()=>balanceEquation('Ca(OH)2 + HCl -> CaCl2 + H2O').pretty==='Ca(OH)2 + 2HCl → CaCl2 + 2H2O');
check('Molecule definitions',()=>MOLECULES.length>=5&&MOLECULES.every(m=>m.atoms.length>0));
check('Material models',()=>MATERIALS.length>=6);
check('Correct periodic group positions',()=>ELEMENTS[2].group===1&&ELEMENTS[3].group===2&&ELEMENTS[4].group===13&&ELEMENTS[9].group===18&&ELEMENTS[17].group===18&&ELEMENTS[29].group===12);
check('Glucose formula counts',()=>{const c=parseFormula('C6H12O6');return c.C===6&&c.H===12&&c.O===6;});
check('Aluminium sulfate nested groups',()=>{const c=parseFormula('Al2(SO4)3');return c.Al===2&&c.S===3&&c.O===12;});
check('Propane combustion balance',()=>balanceEquation('C3H8 + O2 -> CO2 + H2O').pretty==='C3H8 + 5O2 → 3CO2 + 4H2O');
check('Sulfuric acid neutralization balance',()=>balanceEquation('NaOH + H2SO4 -> Na2SO4 + H2O').pretty==='2NaOH + H2SO4 → Na2SO4 + 2H2O');
check('Malformed bracket rejection',()=>{try{parseFormula('Ca(OH2');return false;}catch{return true;}});
check('Unknown element rejection',()=>{try{parseFormula('Xx2');return false;}catch{return true;}});
check('Charged formula rejected instead of misread',()=>{try{parseFormula('Fe3+');return false;}catch{return true;}});
check('Empty bracket group rejected',()=>{try{parseFormula('Ca()');return false;}catch{return true;}});
check('Right-arrow alias balances',()=>balanceEquation('H2 + O2 => H2O').pretty==='2H2 + O2 → 2H2O');
check('Equals alias balances',()=>balanceEquation('H2 + O2 = H2O').pretty==='2H2 + O2 → 2H2O');
check('Empty reaction term rejected',()=>{try{balanceEquation('H2 + + O2 -> H2O');return false;}catch{return true;}});
check('Zero input coefficient rejected',()=>{try{balanceEquation('0H2 + O2 -> H2O');return false;}catch{return true;}});
check('Molarity calculation',()=>Math.abs(molarity(0.5,2)-0.25)<1e-12);
check('Zero volume rejected',()=>{try{molarity(1,0);return false;}catch{return true;}});
check('Avogadro particle count',()=>Math.abs(particleCount(1)/AVOGADRO_CONSTANT-1)<1e-12);
check('Mass-to-moles conversion',()=>Math.abs(molesFromMass(18.015,18.015)-1)<1e-12);
check('Element favourites are unique and valid',()=>periodicFavorites.every(z=>Number.isInteger(z)&&z>=1&&z<=118)&&new Set(periodicFavorites).size===periodicFavorites.length);
check('Quiz bank has at least 100 usable questions',()=>CURR.courses.filter(c=>Array.isArray(c.arOptions)&&Array.isArray(c.enOptions)&&c.arOptions.length===c.enOptions.length&&Number.isInteger(c.correct)&&c.correct>=0&&c.correct<c.arOptions.length).length>=100);
check('Wave tension affects effective frequency',()=>{const old=obsParams.tension;obsParams.tension=50;const base=effectiveWaveFrequency();obsParams.tension=100;const raised=effectiveWaveFrequency();obsParams.tension=old;return raised>base;});
check('Quiz history is an array',()=>Array.isArray(quizHistory));
check('3D atlas covers all 118 elements',()=>ELEMENTS.length===118&&ELEMENTS.every((e,i)=>e.z===i+1));check('Forge recipes conserve selected atom counts',()=>FORGE_RECIPES.every(r=>Object.values(r.need).every(n=>Number.isInteger(n)&&n>0)&&Object.keys(r.need).every(z=>ELEMENTS[+z-1])));check('Forge collection state is valid',()=>Array.isArray(forgeInventory)&&Array.isArray(forgeDiscovered));return {passed:tests.filter(t=>t.ok).length,total:tests.length,ok:tests.every(t=>t.ok),tests};}

x.fillStyle='#b75d74';for(let i=0;i<Math.min(20,e.z);i++){let angle=i*2.4,rr=5+(i%4)*4;x.beginPath();x.arc(cx+Math.cos(angle)*rr,cy+Math.sin(angle)*rr,3.5,0,7);x.fill();}x.fillStyle='#f2c66e';x.beginPath();x.arc(cx,cy,12,0,7);x.fill();x.fillStyle='#fff';x.font='12px sans-serif';x.textAlign='center';x.fillText(`${e.s} · ${n} e⁻`,cx,22);}

if(a==='element3dReset'){element3dRotation=0;element3dZoom=1;render()}else if(a==='openAtomFrom3d'){selectedElement=element3dSelected;go('atom')}else if(a==='forgeClear'){forgeSelected=[];render()}else if(a==='forgeCombine'){const got={};forgeSelected.forEach(z=>got[z]=(got[z]||0)+1);const recipe=FORGE_RECIPES.find(r=>Object.keys(r.need).length===Object.keys(got).length&&Object.entries(r.need).every(([z,n])=>got[z]===n));const out=$('#forgeOutput');if(recipe){let fresh=!forgeDiscovered.includes(recipe.id);if(fresh){forgeDiscovered.push(recipe.id);forgeScore+=recipe.points;forgeInventory=[...new Set([...forgeInventory,...Object.keys(recipe.need).map(Number)])];persistForge()}out.innerHTML=`<div class="forge-result"><b>✓ ${tr('اكتشاف ناجح!','Discovery successful!')} ${tr(recipe.nameAr,recipe.nameEn)}</b><div class="formularesult" dir="ltr">${recipe.formula}</div><p>${tr(recipe.whyAr,recipe.whyEn)}</p><span class="tag green">+${fresh?recipe.points:0} XP</span></div>`;forgeSelected=[];setTimeout(()=>{if(page==='forge')render()},900)}else{out.innerHTML=`<div class="notice">${tr('هذه النسبة لا تطابق وصفة مكتشفة بعد. راجع عدد ذرات كل عنصر وحاول مرة أخرى.','These atom counts do not match a supported recipe. Check each element count and try again.')}</div>`}}else if(a==='startQuiz'||a==='restartQuiz'){startQuizRound()}else if(a==='quizHome'||a==='quitQuiz'){quizQuestions=[];quizIndex=0;quizSelected=null;quizAnswered=false;page='quiz';render()}else if(a==='checkQuizAnswer'){if(quizSelected===null){toast(tr('اختر إجابة أولًا.','Choose an answer first.'));return;}if(quizAnswered)return;quizAnswered=true;if(quizSelected===quizQuestions[quizIndex].correct)quizScore++;render()}else if(a==='nextQuiz'){if(!quizAnswered)return;if(quizIndex+1>=quizQuestions.length){quizHistory.push({score:quizScore,total:quizQuestions.length,at:new Date().toLocaleString(lang==='ar'?'ar-EG':'en-GB')});quizHistory=quizHistory.slice(-50);store.set('quizHistory',quizHistory);quizIndex=quizQuestions.length;render()}else{quizIndex++;quizSelected=null;quizAnswered=false;render()}}else if(a==='installApp'){promptInstall()}else if(a==='toggleBilingual'){bilingualMode=!bilingualMode;store.set('bilingualMode',bilingualMode);render()}else if(a==='academy')go('academy');else if(a==='lab')go('lab');else if(a==='microscope')go('microscope');else if(a==='periodic')go('periodic');else if(a==='atom')go('atom');else if(a==='chemistry')go('chemistry');else if(a==='backAcademy')go('academy');else if(a==='lessonTool')lessonTool();else if(a==='toggleElementFavorite'){periodicFavorites=periodicFavorites.includes(selectedElement)?periodicFavorites.filter(z=>z!==selectedElement):[...periodicFavorites,selectedElement];store.set('periodicFavorites',periodicFavorites);render()}else if(a==='clearPeriodicSearch'){store.set('periodicQuery','');periodicCategory='all';render()}else if(a==='openAtomFromPeriodic')go('atom');else if(a==='openChemistryFromAtom')go('chemistry');else if(a==='resetAtom'){atomSpeed=.7;render()}else if(a==='moleculeReset'){moleculeAngle=0;render()}else if(a==='importBackup')$('#backupInput')?.click();else if(a==='runDiagnostics'){let r=runSelfTests();toast(tr(`نتيجة الفحص: ${r.passed}/${r.total} اختبارات ناجحة`,`Diagnostics: ${r.passed}/${r.total} tests passed`));console.table(r.tests)}else if(a==='calculateMoles'){try{let formula=$('#molesFormula').value,mass=Number($('#molesMass').value),mm=molarMass(formula).mass,n=molesFromMass(mass,mm);$('#molesOutput').innerHTML=`<div class="formularesult">${n.toFixed(6)} mol</div><p class="scopenote">n = m / M · ${mass} / ${mm.toFixed(4)}</p>`}catch(err){$('#molesOutput').innerHTML=`<div class="notice">${esc(err.message)}</div>`}}else if(a==='calculateMolarity'){try{let n=Number($('#molarityMoles').value),v=Number($('#molarityVolume').value),c=molarity(n,v);$('#molarityOutput').innerHTML=`<div class="formularesult">${c.toPrecision(6)} mol/L</div><p class="scopenote">c = n / V · ${n} / ${v}</p>`}catch(err){$('#molarityOutput').inne Mode==='waves'?`f=${effectiveWaveFrequency().toFixed(3)} Hz, tension=${obsParams.tension}%, T=${(1/effectiveWaveFrequency()).toFixed(3)} s`:obsMode==='circuit'?`I=${(obsParams.voltage/obsParams.resistance).toFixed(3)} A, P=${(obsParams.voltage**2/obsParams.resistance).toFixed(2)} W`:obsMode==='gravity'?`g=${obsParams.gravity} m/s², W(1kg)=${obsParams.gravity} N`:`prey=${obsParams.prey}%, predator=${obsParams.predator}%`;obsLog.push({name:OBS_MODES.find(x=>x[0]===obsMode)[2],value,at:new Date().toISOString()});store.set('obsLog',obsLog);render();toast(tr('تم حفظ القراءة.','Reading saved.'))}else if(a==='obsSnapshot'){let c=$('#obsCanvas');if(c){let l=document.createElement('a');l.href=c.toDataURL('image/png');l.download='atomverse-observatory.png';l.click()}}else if(a==='obsExport'){let blob=new Blob([JSON.stringify(obsLog,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='atomverse-observatory-log.json';l.click();URL.revokeObjectURL(u)}else if(a==='obsClear'){if(confirm(tr('مسح سجل الاستكشاف؟','Clear exploration log?'))){obsLog=[];store.set('obsLog',obsLog);render()}}else if(a==='micPause'){micPaused=!micPaused;let b=e.target.closest('[data-action]');if(b)b.textContent=micPaused?tr('تشغيل','Play'):tr('إيقاف مؤقت','Pause');drawMic(performance.now())}else if(a==='micCamera')await startCamera();else if(a==='micStopCamera'){stopCamera();micMode='simulation';render()}else if(a==='micChoosePhoto')choosePhoto();else if(a==='micBackSimulation'){stopCamera();micMode='simulation';render()}else if(a==='micSnapshot'){let c=$('#micCanvas');if(!c)return;let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='atomverse-microscope-snapshot.png';a.click()}else if(a==='molarMass'){try{let r=molarMass($('#massFormula').value);$('#massOutput').innerHTML=`<div class="formularesult">${r.mass.toFixed(4)} g/mol</div><p class="muted" style="font-size:10px">${Object.entries(r.counts).map(([s,n])=>`${s}: ${n}`).join(' · ')}</p>`}catch(err){$('#massOutput').innerHTML=`<div class="notice">${esc(err.message)}</div>`}}else if(a==='balanceEquation'){try{let r=balanceEquation($('#equationInput').value);$('#balanceOutput').innerHTML=`<div class="formularesult" dir="ltr">${esc(r.pretty)}</div><p class="tag green">✓ ${tr('تم إيجاد معاملات صحيحة بحفظ عدد الذرات','Integer coefficients found with atom conservation')}</p>`}catch(err){$('#balanceOutput').innerHTML=`<div class="notice">${esc(err.message)}</div>`}}else if(a==='saveNote'){let title=$('#noteTitle').value.trim(),body=$('#noteBody').value.trim();if(!title||!body){toast(tr('اكتب عنوانًا ومحتوى للملاحظة.','Enter a title and note content.'));return}notes.unshift({title,body,at:new Date().toISOString()});store.set('notes',notes);render();toast(tr('تم حفظ الملاحظة.','Note saved.'))}else if(a==='exportBackup'){let blob=new Blob([JSON.stringify({app:'AtomVerse X',version:'9.0.0',exportedAt:new Date().toISOString(),completed,notes,stage,grade,lang,theme,bilingualMode,learningLevel,periodicFavorites,obsLog,challengeAnswers,quizHistory,forgeInventory,forgeDiscovered,forgeScore},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='atomverse-x-9.0.0-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}else if(a==='clearData'){if(confirm(tr('هل تريد مسح الملاحظات والتقدم والمفضلة المحفوظة على هذا الجهاز؟','Clear saved notes, progress and favorites on this device?'))){for(let i=localStorage.length-1;i>=0;i--){let k=localStorage.key(i);if(k&&(k.startsWith('avx54:')||k.startsWith('avx9:')))localStorage.removeItem(k)}completed=[];notes=[];periodicFavorites=[];challengeAnswers={};obsLog=[];quizHistory=[];quizQuestions=[];forgeSelected=[];forgeInventory=[1,6,7,8,11,12,17,26,29];forgeDiscovered=[];forgeScore=0;forgeLevel=1;persistForge();store.set('quizHistory',quizHistory);render()}}});
document.addEventListener('input',e=>{let id=e.target.id;if(id==='element3dZoom'){element3dZoom=+e.target.value;let l=$('#element3dZoomLabel');if(l)l.textContent=element3dZoom.toFixed(1)+'×'}else if(id==='element3dSearch'){let q=e.target.value.toLowerCase().trim();document.querySelectorAll('[data-element3d]').forEach(b=>{let z=ELEMENTS[+b.dataset.element3d-1];b.hidden=!!q&&!`${z.name} ${z.ar} ${z.s} ${z.z}`.toLowerCase().includes(q)})}else if(id==='academySearch'){let q=e.target.value.toLowerCase().trim();document.querySelectorAll('[data-course-card]').forEach(card=>{card.hidden=!!q&&!card.dataset.search.includes(q)});document.querySelectorAll('[data-unit-section]').forEach(section=>{section.hidden=!section.querySelector('[data-course-card]:not([hidden])')});return}else if(['frequency','amplitude','tension','voltage','resistance','gravity','prey','predator'].includes(id)){obsParams[id]=+e.target.value;let v=$('#'+id+'Val');if(v)v.textContent=obsParams[id]+(id==='frequency'?' Hz':id==='voltage'?' V':id==='resistance'?' Ω':id==='gravity'?' m/s²':'%');let m=$('#obsMetrics');if(m)m.innerHTML=obsMetrics();drawObs(performance.now())}else if(id==='periodicSearch'){let q=e.target.value.toLowerCase().trim();store.set('periodicQuery',q);$$('.element[data-element]').forEach(b=>{let z=ELEMENTS[+b.dataset.element-1];b.hidden=!periodicElementMatches(z,q)});}else if(id==='atomSpeed'){atomSpeed=+e.target.value;let l=$('#atomSpeedLabel');if(l)l.textContent=atomSpeed.toFixed(1)+'×'}else if(id==='moleculeAngle'){moleculeAngle=+e.target.value;let l=$('#moleculeAngleLabel');if(l)l.textContent=Math.round(moleculeAngle)+'°';drawMolecule()}else if(id==='materialZoom'){materialZoom=+e.target.value;let l=$('#materialZoomLabel');if(l)l.textContent=materialZoom.toFixed(1)+'×';drawMaterial()}else if(id==='electronCount'){let l=$('#electronLabel');if(l)l.textContent=e.target.value;drawAtom(performance.now())}else if(id==='micZoom'){micZoom=+e.target.value;$('#zoomLabel').textContent=micZoom+'×';$('#micMag').textContent=micMode==='simulation'?micZoom+'×':micMode==='camera'?`DIGITAL ${(micZoom/400).toFixed(1)}×`:'IMAGE'}else if(id==='micLight'){micLight=+e.target.value;$('#lightLabel').textContent=micLight+'%'}else if(id==='micSpeed'){micSpeed=+e.target.value;$('#speedLabel').textContent=micSpeed.toFixed(1)+'×'}else if(['mass','volume','fluid','force','bodyMass','voltage','resistance','light','co2','temp','wave','phaseTemp','reactTemp','reactConc','magCurrent','magTurns'].includes(id)){setLabParam(id,e.target.value);drawLab(performance.now())}});

function importBackupFile(file){if(!file)return;if(file.size>2*1024*1024){toast(tr('ملف النسخة أكبر من 2 ميجابايت.','Backup file is larger than 2 MB.'));return;}const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(String(reader.result||''));if(!data||typeof data!=='object'||Array.isArray(data)||!Array.isArray(data.notes)||!Array.isArray(data.completed))throw new Error(tr('بنية ملف النسخة غير صحيحة.','Invalid backup structure.'));notes=data.notes.filter(n=>n&&typeof n.title==='string'&&typeof n.body==='string').slice(0,500).map(n=>({title:n.title.slice(0,90),body:n.body.slice(0,12000),at:typeof n.at==='string'?n.at:''}));completed=[...new Set(data.completed.filter(id=>typeof id==='string'&&CURR.courses.some(c=>c.id===id)))];periodicFavorites=[...new Set(Array.isArray(data.periodicFavorites)?data.periodicFavorites.filter(z=>Number.isInteger(z)&&z>=1&&z<=118):[])];forgeInventory=[...new Set(Array.isArray(data.forgeInventory)?data.forgeInventory.filter(z=>Number.isInteger(z)&&z>=1&&z<=118):forgeInventory)];forgeDiscovered=Array.isArray(data.forgeDiscovered)?data.forgeDiscovered.filter(id=>FORGE_RECIPES.some(r=>r.id===id)):forgeDiscovered;forgeScore=Number.isFinite(data.forgeScore)?Math.max(0,Math.min(100000,Math.floor(data.forgeScore))):forgeScore;persistForge();const validCourseIds=new Set(CURR.courses.map(c=>c.id));challengeAnswers={};if(data.challengeAnswers&&typeof data.challengeAnswers==='object'&&!Array.isArray(data.challengeAnswers)){for(const [id,value] of Object.entries(data.challengeAnswers)){if(validCourseIds.has(id)&&typeof value==='string')challengeAnswers[id]=value.slice(0,12000);}}quizHistory=Array.isArray(data.quizHistory)?data.quizHistory.filter(x=>x&&typeof x==='object'&&Number.isFinite(x.score)&&Number.isFinite(x.total)&&x.total>0&&x.score>=0&&x.score<=x.total).slice(-50):[];obsLog=Array.isArray(data.obsLog)?data.obsLog.filter(x=>x&&typeof x==='object'&&typeof x.value==='string').slice(-500).map(x=>({name:String(x.name||'').slice(0,100),value:x.value.slice(0,500),at:typeof x.at==='string'?x.at:''})):[];if(['primary','preparatory','secondary','university'].includes(data.stage))stage=data.stage;if(Number.isInteger(Number(data.grade))&&Number(data.grade)>=1&&Number(data.grade)<=(stage==='primary'?6:stage==='university'?4:3))grade=Number(data.grade);if(data.lang==='ar'||data.lang==='en')lang=data.lang;if(data.theme==='dark'||data.theme==='light')theme=data.theme;if(typeof data.bilingualMode==='boolean')bilingualMode=data.bilingualMode;if(['simple','medium','advanced'].includes(data.learningLevel))learningLevel=data.learningLevel;for(const [k,v] of Object.entries({notes,completed,periodicFavorites,challengeAnswers,obsLog,quizHistory,stage,grade,lang,theme,bilingualMode,learningLevel}))store.set(k,v);render();document.body.classList.toggle('light',theme==='light');toast(tr('تم استيراد الملاحظات والتقدم والإعدادات المدعومة.','Notes, progress and supported settings imported.'));}catch(err){toast(tr('تعذر استيراد النسخة: ','Could not import backup: ')+err.message);}};reader.onerror=()=>toast(tr('تعذر قراءة الملف.','Could not read the file.'));reader.readAsText(file);}

document.addEventListener('change',e=>{let id=e.target.id;if(id==='element3dSelect'){element3dSelected=+e.target.value;render()}else if(id==='gradeSelect'){grade=+e.target.value;store.set('grade',grade);subject='all';term='all';render()}else if(id==='routeSelect'){route=e.target.value;track='all';render()}else if(id==='subjectSelect'){subject=e.target.value;render()}else if(id==='termSelect'){term=e.target.value;render()}else if(id==='trackSelect'){track=e.target.value;render()}else if(id==='atomElement'){selectedElement=+e.target.value;render()}else if(id==='micSample'){micSample=e.target.value;render()}else if(id==='moleculeSelect'){moleculeId=e.target.value;render()}else if(id==='materialSelect'){materialId=e.target.value;render()}else if(id==='periodicCategory'){periodicCategory=e.target.value;const q=$('#periodicSearch')?.value.toLowerCase().trim()||'';$$('.element[data-element]').forEach(b=>{let z=ELEMENTS[+b.dataset.element-1];b.hidden=!periodicElementMatches(z,q)})}else if(id==='settingsLang'){lang=e.target.value;store.set('lang',lang);render()}else if(id==='imageInput'){loadPhoto(e.target.files?.[0]);e.target.value=''}else if(id==='backupInput'){importBackupFile(e.target.files?.[0]);e.target.value=''}});
if(!document.querySelector('[data-action="installApp"]')){/* install is available from the browser menu when no prompt event was fired */}

let deferredInstallPrompt=null;

if('ResizeObserver'in window){const ro=new ResizeObserver(()=>scheduleAdaptiveLayout());const observeTargets=()=>{for(const el of [document.querySelector('.app'),document.querySelector('.content')])if(el)ro.observe(el)};observeTargets();}

const diagnostics=runSelfTests();console.info('[AtomVerse X 9.0.0] diagnostics',diagnostics);if(!diagnostics.ok)console.warn('One or more science-engine checks failed.');
render();if(theme==='light')document.body.classList.add('light');
})();
